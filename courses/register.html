<meta charset="UTF-8">

<title>
Student Registration | PU's Academics

<!-- ==========================================================

<!-- ==========================================================

========================================================== -->

<style>

/* ==========================================================
REGISTRATION PAGE
========================================================== */

.register-wrapper {

    min-height: 70vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px 20px;

}


.register-card {

    width: 100%;

    max-width: 500px;

}


.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    font-weight: 600;

    margin-bottom: 6px;

}


.form-group input,

.form-group select {

    width: 100%;

    padding: 12px;

    box-sizing: border-box;

    font-family: inherit;

    font-size: 15px;

}


.register-button {

    width: 100%;

    border: none;

    cursor: pointer;

}


.message {

    display: none;

    margin-top: 20px;

    padding: 12px;

    border-radius: 4px;

}


.error {

    background: #ffe5e5;

    color: #a00000;

}


.success {

    background: #e5f7e5;

    color: #176b17;

}


.login-link {

    text-align: center;

    margin-top: 20px;

}


.loading {

    opacity: 0.7;

    pointer-events: none;

}

</style>

</head>


<body>


<!-- ==========================================================
HEADER
========================================================== -->

<header class="site-header">

<div class="container header-content">

<div>

<h1 class="site-title">

PU's Academics

<p class="site-tagline">

Learn Today. Lead Tomorrow.

</p>

</div>


<button
id="themeToggle"
class="theme-toggle">

🌙

<!-- ==========================================================
HERO

Student Registration

</h2>

<p>

</div>

<!-- ==========================================================
REGISTRATION FORM

<main class="container register-wrapper">


<div class="course-card register-card">

Create Account

<!-- ========================================================

========================================================= -->

<!-- ========================================================
LAST NAME

<label for="lastName">

Last Name

<input
type="text"
id="lastName"
placeholder="Enter last name"
required
autocomplete="family-name">

</div>



<!-- ========================================================
ROLL NUMBER
========================================================= -->

<div class="form-group">

<label for="rollNo">

Roll Number

</label>

<input
type="text"
id="rollNo"
placeholder="Enter roll number"
required>

</div>



<!-- ========================================================
COURSE
========================================================= -->

<div class="form-group">

<label for="course">

Course

</label>

<select
id="course"
required>

<option value="">

-- Select Course --

</option>

<option value="Python Programming">

Python Programming

</option>

<option value="Core Java">

Core Java

</option>

<option value="Machine Learning">

Machine Learning

</option>

<option value="AIML Essentials">

AIML Essentials

</option>

</select>

</div>



<!-- ========================================================
EMAIL
========================================================= -->

<div class="form-group">

<label for="email">

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter email address"
required

</div>



<!-- ========================================================
PASSWORD
========================================================= -->

</label>

========================================================= -->

<!-- ==========================================================
SUPABASE JAVASCRIPT LIBRARY
========================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<!-- ==========================================================
MAIN JAVASCRIPT
========================================================== -->

<script
src="../assets/js/main.js">
</script>



<!-- ==========================================================
SUPABASE REGISTRATION
========================================================== -->

<script>


/* ==========================================================
SUPABASE CONFIGURATION
========================================================== */

/*
   IMPORTANT:
   Replace these two values with your actual
   Supabase Project URL and Publishable Key.
*/


const SUPABASE_URL =
"https://hlffptshgsqhrslrycji.supabase.co";


const SUPABASE_KEY =
"sb_publishable_48Nmv1EBi9katkdWEld6Ag_UlYvGWjz";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* ==========================================================
FORM ELEMENTS
========================================================== */

const registerForm =
document.getElementById("registerForm");


const message =
document.getElementById("message");


const registerButton =
document.getElementById("registerButton");



/* ==========================================================
SHOW MESSAGE FUNCTION
========================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}



/* ==========================================================
REGISTRATION
========================================================== */

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* Hide previous message */

        message.style.display =
            "none";


        /* Disable button */

        registerButton.disabled =
            true;

        registerButton.textContent =
            "Registering...";

        registerButton.classList.add(
            "loading"
        );



        /* ==================================================
           GET FORM VALUES
        ================================================== */

        const firstName =
            document.getElementById(
                "firstName"
            ).value.trim();


        const lastName =
            document.getElementById(
                "lastName"
            ).value.trim();


        const rollNo =
            document.getElementById(
                "rollNo"
            ).value.trim();


        const course =
            document.getElementById(
                "course"
            ).value;


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;



        /* ==================================================
           BASIC VALIDATION
        ================================================== */

        if (
            !firstName ||
            !lastName ||
            !rollNo ||
            !course ||
            !email ||
            !password
        ) {

            showMessage(
                "Please fill in all fields.",
                "error"
            );

            resetButton();

            return;

        }



        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            resetButton();

            return;

        }



        /* ==================================================
           CREATE SUPABASE AUTH USER
           
           IMPORTANT:
           Student information is stored in user metadata.
           
           The database trigger automatically creates
           the corresponding profile record.
        ================================================== */

        const {

            data: authData,

            error: authError

        } = await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    first_name:
                        firstName,

                    last_name:
                        lastName,

                    roll_no:
                        rollNo,

                    course:
                        course

                }

            }

        });



        /* ==================================================
           HANDLE AUTH ERROR
        ================================================== */

        if (authError) {

            console.error(
                "Registration error:",
                authError
            );


            let errorMessage =
                authError.message;


            /*
               Make common messages easier
               for students to understand.
            */

            if (
                errorMessage
                    .toLowerCase()
                    .includes("already registered")
            ) {

                errorMessage =
                    "This email is already registered. Please login instead.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            resetButton();

            return;

        }



        /* ==================================================
           CHECK USER
        ================================================== */

        if (
            !authData ||
            !authData.user
        ) {

            showMessage(
                "Registration could not be completed. Please try again.",
                "error"
            );


            resetButton();

            return;

        }



        /* ==================================================
           SUCCESS
        ================================================== */

        /*
           The Supabase database trigger should now
           automatically create the student's profile.
        */


        showMessage(
            "Registration successful! Redirecting to login...",
            "success"
        );



        /* ==================================================
           REDIRECT
        ================================================== */

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            2000
        );



    }
);



/* ==========================================================
RESET BUTTON
========================================================== */

function resetButton() {

    registerButton.disabled =
        false;

    registerButton.textContent =
        "Register";

    registerButton.classList.remove(
        "loading"
    );

}

</script>


</body>

</html>
